# Render Blueprint — one web service (API + bot + Mini App) + PostgreSQL.
# This file lives at the REPOSITORY ROOT (Render looks for it here);
# rootDir points the build/start commands into code/, where the app is.
# After the first deploy, set WEBAPP_URL to https://<service>.onrender.com/webapp/
# and BOT_USERNAME / BOT_TOKEN / ADMIN_IDS in the Render dashboard.
services:
  - type: web
    name: nexora
    runtime: python
    rootDir: code
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-db
          property: connectionString
databases:
  - name: nexora-db
    plan: basic-256mb
